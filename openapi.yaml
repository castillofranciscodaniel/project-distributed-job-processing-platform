openapi: 3.0.3
info:
  title: Distributed Contract Processing API
  description: API para la gestión de clientes y procesamiento distribuido de contratos.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Servidor Local

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Verifica el estado del servicio y su conectividad con la base de datos.
      responses:
        '200':
          description: El servicio está operativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: El servicio no está disponible (ej. error de base de datos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/clients:
    post:
      summary: Crear un nuevo cliente
      description: Registra un cliente en el sistema.
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
      responses:
        '201':
          description: Cliente creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          description: Datos de entrada inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/clients/{id}:
    get:
      summary: Obtener un cliente por ID
      description: Retorna los detalles de un cliente específico.
      operationId: getClientById
      parameters:
        - name: id
          in: path
          required: true
          description: ID del cliente (ObjectID hex)
          schema:
            type: string
      responses:
        '200':
          description: Detalles del cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '404':
          description: Cliente no encontrado.

  /api/v1/contracts:
    post:
      summary: Subir un nuevo contrato
      description: Sube un archivo de contrato a S3 e inicia su procesamiento. Requiere el ID del cliente en el header.
      operationId: uploadContract
      parameters:
        - name: client_id
          in: header
          required: true
          description: ID del cliente que sube el contrato.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '202':
          description: Contrato aceptado para procesamiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponse'
        '400':
          description: Error en la petición o archivo faltante.

  /api/v1/contracts/{id}:
    get:
      summary: Obtener contrato por ID
      description: Retorna los metadatos y la URL del contrato.
      operationId: getContractById
      parameters:
        - name: id
          in: path
          required: true
          description: ID del contrato.
          schema:
            type: string
      responses:
        '200':
          description: Detalles del contrato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponse'

  /api/v1/contracts/client:
    get:
      summary: Listar contratos de un cliente
      description: Retorna todos los contratos asociados a un cliente.
      operationId: listContractsByClient
      parameters:
        - name: client_id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de contratos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contract'

  /api/v1/contracts/client/zip:
    post:
      summary: Descargar todos los contratos de un cliente en ZIP
      description: Inicia un proceso asíncrono para empaquetar todos los contratos del cliente y enviarlos por email.
      operationId: downloadContractsZip
      parameters:
        - name: client_id
          in: header
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Proceso de compresión iniciado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: UP

    CreateClientRequest:
      type: object
      required:
        - name
        - lastName
        - email
        - identifier
      properties:
        name:
          type: string
        lastName:
          type: string
        email:
          type: string
        identifier:
          type: string

    Client:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        lastName:
          type: string
        email:
          type: string
        identifier:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Contract:
      type: object
      properties:
        id:
          type: string
        clientId:
          type: string
        status:
          type: string
          enum: [PENDING, ACCEPTED, PROCESSING, COMPLETED, FAILED]
        key:
          type: string
        bucket:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContractResponse:
      type: object
      properties:
        contract_id:
          type: string
        url:
          type: string
        status:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
